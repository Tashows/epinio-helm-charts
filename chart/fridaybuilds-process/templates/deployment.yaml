apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epinio-truncate" .Values.epinio.appName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epinio-application.labels" . | nindent 4 }}
  annotations:
    {{- include "epinio-application.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.epinio.replicaCount }}
  selector:
    matchLabels:
      {{- include "epinio-application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        app.kubernetes.io/name: {{ .Values.epinio.appName | quote }}
        {{- include "epinio-application.annotations" . | nindent 8 }}
        {{- with .Values.epinio.start }}
        epinio.io/start: {{ . | quote }}
        {{- end }}
      labels:
        {{- include "epinio-application.labels" . | nindent 8 }}
        epinio.io/stage-id: {{ .Values.epinio.stageID | quote }}
        epinio.io/app-container: {{ include "epinio-truncate" .Values.epinio.appName }}
    spec:
      serviceAccount: {{ .Values.userConfig.serviceAccountName | default .Release.Namespace }} # deprecated, kept for backward compatibility, will be removed in future Kubernetes versions
      serviceAccountName: {{ .Values.userConfig.serviceAccountName | default .Release.Namespace }}
      {{- /* Mounted unless userConfig.automountServiceAccountToken is false, for processes that don't use the Kubernetes API */}}
      automountServiceAccountToken: {{ ne (toString (dig "automountServiceAccountToken" true .Values.userConfig)) "false" }}
      runtimeClassName: "gvisor"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1002
      volumes:
      {{- with .Values.epinio.configurations }}
      {{- range . }}
      - name: {{ . }}
        secret:
          defaultMode: 420
          secretName: {{ . }}
      {{- end }}
      {{- end }}
      - name: tmp
        emptyDir: {}
      {{- if include "fridaybuilds-volume-claim-name" . | trim }}
      - name: {{ include "fridaybuilds-pod-volume-name" . | trim }}
        persistentVolumeClaim:
          claimName: {{ include "fridaybuilds-volume-claim-name" . | trim }}
      {{- end }}
      initContainers:
      - name: clean-tmp
        image: busybox:latest
        # fixes rails tmp/pids leftovers from previous runs when container crashes but pod remains
        command:
          - sh
          - -c
          - |
            rm -rf /workspace/source/app/tmp/pids/*
            rm -rf /workspace/source/app/tmp/sockets/*
        volumeMounts:
        - name: tmp
          mountPath: /workspace/source/app/tmp
      {{- if include "fridaybuilds-volume-claim-name" . | trim }}
      - name: fix-volume-permissions
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            chown 1002:1000 /volume-data
            chmod 775 /volume-data
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: {{ include "fridaybuilds-pod-volume-name" . | trim }}
            mountPath: /volume-data
      {{- end }}
      containers:
      - name: {{ include "epinio-truncate" .Values.epinio.appName }}
        {{- if include "epinio-app-listening-port" . }}
        ports:
        - containerPort: {{ include "epinio-app-listening-port" . }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        {{- with .Values.epinio.configpaths }}
        {{- range . }}
        - mountPath: /configurations/{{ .path }}
          name: {{ .name }}
          readOnly: true
        {{- end }}
        {{- end }}
        - name: tmp
          mountPath: /workspace/source/app/tmp
        {{- if include "fridaybuilds-volume-claim-name" . | trim }}
        - name: {{ include "fridaybuilds-pod-volume-name" . | trim }}
          mountPath: {{ include "fridaybuilds-volume-mount-path" . | trim }}
        {{- end }}
        env:
        {{- if include "epinio-app-listening-port" . }}
        - name: PORT
          value: {{ include "epinio-app-listening-port" . | quote }}
        {{- end }}
        {{- range .Values.epinio.env }}
        - name: {{ .name | quote }}
          value: {{ .value | quote }}
        {{- end}}
        image: {{ .Values.epinio.imageURL }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "epinio-application-resources" . | nindent 8 }}
        {{- with .Values.userConfig.commandArgs }}
        command:
          - /cnb/lifecycle/launcher
        args:
          {{- range splitList " " . }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
