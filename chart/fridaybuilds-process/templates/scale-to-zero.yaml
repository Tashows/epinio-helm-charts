{{- /* Scaling to zero with KEDA's HTTP add-on, see fridaybuilds-sleep-mode in _helpers.tpl */}}
{{- $mode := include "fridaybuilds-sleep-mode" . }}
{{- if eq $mode "route" }}
---
# The Ingress sends the requests here, and the interceptor forwards them to the app's pods
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fridaybuilds-interceptor-service-name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "epinio-application.labels" . | nindent 4 }}
  annotations:
    {{- include "epinio-application.annotations" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.keda.interceptorService }}
  ports:
    - port: {{ .Values.keda.interceptorPort }}
      protocol: TCP
---
# Matches the app's requests in the interceptor, counts them for scaling and holds them while the app wakes up
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ include "fridaybuilds-sleep-route-name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "epinio-application.labels" . | nindent 4 }}
  annotations:
    {{- include "epinio-application.annotations" . | nindent 4 }}
spec:
  target:
    service: {{ include "epinio-truncate" .Values.epinio.appName }}
    port: 8080
  rules:
    {{- range .Values.epinio.routes }}
    - hosts:
        - {{ .domain | quote }}
      {{- if and .path (ne .path "/") }}
      paths:
        - value: {{ .path | quote }}
      {{- end }}
    {{- end }}
  # Required, but unused: the workload scales between 0 and replicaCount only
  scalingMetric:
    concurrency:
      targetValue: 100
  timeouts:
    readiness: {{ .Values.keda.wakeTimeout | quote }}
{{- end }}
{{- if $mode }}
---
# KEDA owns the Deployment's replicas: 0 once no request arrived for sleepAfterSeconds, replicaCount as soon as one does.
# Rendered after the InterceptorRoute (helm installs unknown kinds alphabetically), which KEDA's scaler has to know.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "epinio-truncate" .Values.epinio.appName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "epinio-application.labels" . | nindent 4 }}
  annotations:
    {{- include "epinio-application.annotations" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "epinio-truncate" .Values.epinio.appName }}
  idleReplicaCount: 0
  minReplicaCount: {{ .Values.epinio.replicaCount }}
  maxReplicaCount: {{ .Values.epinio.replicaCount }}
  cooldownPeriod: {{ include "fridaybuilds-sleep-after-seconds" . }}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: {{ .Values.keda.externalScalerAddress | quote }}
        interceptorRoute: {{ include "fridaybuilds-sleep-route-name" . | quote }}
{{- end }}
